<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Tunai</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- APP BAR -->
    <div class="header">
        <div class="icon-circle">
            <i class="fas fa-money-bill-wave"></i>
        </div>
        <h2>SETORAN TUNAI</h2>
        <p class="sub">Mobile Cash Deposit System</p>
    </div>

    <!-- FORM -->
    <div class="form-group">
        <label>Total Uang Cash</label>
        <div class="input-box">
            <i class="fas fa-wallet"></i>
            <input type="number" id="cash" placeholder="Masukkan total uang cash">
        </div>
    </div>

    <div class="form-group">
        <label>Admin</label>
        <div class="input-box">
            <i class="fas fa-minus-circle"></i>
            <input type="number" id="admin" value="0">
        </div>
    </div>

    <div class="form-group">
        <label>Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user-minus"></i>
            <input type="number" id="penyetor" value="0">
        </div>
    </div>

    <!-- RESULT CARD -->
    <div class="form-group">
        <label>Sisa TF</label>
        <div class="hasil" id="sisaTF">
            Rp 0
        </div>
    </div>

    <div class="form-group">
        <label>Nama Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user"></i>
            <select id="namaPenyetor">
                <option value="">Pilih Penyetor</option>
                <option value="Rizki Wahyu Chandra">Rizki Wahyu Chandra</option>
                <option value="Leo Adrian">Leo Adrian</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Nama Konter</label>
        <div class="input-box">
            <i class="fas fa-store"></i>
            <input type="text" id="namaKonter" placeholder="Nama konter">
        </div>
    </div>

    <!-- MEDIA PREVIEW -->
    <div class="media-card">

        <div class="media-title">
            <i class="fas fa-camera"></i>
            Bukti Transfer
        </div>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" class="preview" alt="Preview Foto">
    </div>

    <!-- ACTION BUTTONS -->
    <div class="button-group">

        <button type="button" class="camera" onclick="startCamera()">
            <i class="fas fa-camera"></i>
            Kamera
        </button>

        <button type="button" class="capture" onclick="capturePhoto()">
            <i class="fas fa-image"></i>
            Foto
        </button>

        <button type="button" class="wa" onclick="shareWA()">
            <i class="fab fa-whatsapp"></i>
            Share
        </button>

        <button type="button" class="reset" onclick="resetForm()">
            <i class="fas fa-rotate-left"></i>
            Reset
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
