<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setoran Tunai POS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="pageSetoran"></div>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="icon-circle">
            <i class="fas fa-money-bill-wave"></i>
        </div>

        <h2>GAMEZONE PADANG</h2>
        <p class="sub">SETORAN TUNAI</p>
    </div>

    <!-- STEP -->
    <div class="stepper">

        <div class="step active">
            <span>1</span>
            <small>Data</small>
        </div>

        <div class="step-line"></div>

        <div class="step">
            <span>2</span>
            <small>Nominal</small>
        </div>

        <div class="step-line"></div>

        <div class="step">
            <span>3</span>
            <small>Bukti</small>
        </div>

    </div>

    <!-- SLIDER -->
    <div class="slider">

        <!-- =====================
             SLIDE 1
        ====================== -->

        <div class="slide active">

            <div class="form-group">
                <label>
                    <i class="fas fa-user"></i>
                    Nama Penyetor
                </label>

                <div class="input-box">
                    <i class="fas fa-user"></i>

                    <select id="namaPenyetor">
                        <option value="">Pilih Penyetor</option>
                        <option>Rizki Wahyu Chandra</option>
                        <option>Leo Adrian</option>
                    </select>
                </div>

            </div>

            <div class="form-group">

                <label>
                    <i class="fas fa-store"></i>
                    Nama Konter
                </label>

                <div class="input-box">
                    <i class="fas fa-store"></i>
                    <input type="text" id="namaKonter" placeholder="Nama Konter">
                </div>

            </div>

        </div>

        <!-- =====================
             SLIDE 2
        ====================== -->

        <div class="slide">

            <div class="form-grid">

                <div class="form-group">
                    <label><i class="fas fa-wallet"></i>Total Cash</label>

                    <div class="input-box">
                        <i class="fas fa-wallet"></i>
                        <input type="number" id="cash">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-minus-circle"></i>Admin</label>

                    <div class="input-box">
                        <i class="fas fa-minus-circle"></i>
                        <input type="number" id="admin" value="0">
                    </div>
                </div>

                <div class="form-group full-width">

                    <label><i class="fas fa-user-minus"></i>Penyetor</label>

                    <div class="input-box">
                        <i class="fas fa-user-minus"></i>
                        <input type="number" id="penyetor" value="0">
                    </div>

                </div>

                <div class="hasil full-width">
                    <span class="hasil-title">SISA TF</span>
                    <span id="sisaTF">Rp 0</span>
                </div>

            </div>



        </div>

        <!-- =====================
             SLIDE 3
        ====================== -->

        <div class="slide">

            <div class="media-card">

                <div class="media-title">
                    <i class="fas fa-camera"></i>
                    Bukti Transfer
                </div>

                <video id="video" autoplay playsinline muted></video>

                <canvas id="canvas" style="display:none;"></canvas>

                <img id="preview" style="display:none;">

            </div>

        </div>

    </div>

    <!-- NAVIGASI -->

    <div class="slider-nav">

        <button id="prevBtn" class="nav-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Sebelumnya

        </button>

        <button id="nextBtn" class="nav-btn">

            Berikutnya

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</div>
<!-- Floating Action Button -->

<div class="fab-container">

    <button class="fab-menu" id="fabMenu">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div class="fab-items" id="fabItems">

        <button class="fab camera" onclick="startCamera()" title="Buka Kamera">
            <i class="fa-solid fa-video"></i>
        </button>

        <button class="fab capture" onclick="capturePhoto()" title="Ambil Foto">
            <i class="fa-solid fa-camera"></i>
        </button>

        <button class="fab wa" onclick="shareWA()" title="Kirim WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
        </button>

        <button class="fab reset" onclick="resetForm()" title="Reset">
            <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>

    </div>

</div>

</div>
<script src="script.js"></script>

</body>
</html>
