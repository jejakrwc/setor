<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Tunai</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <i class="fas fa-money-bill-wave"></i>
        <h2>SETORAN TUNAI</h2>
    </div>

    <div class="form-group">
        <label>Total Uang Cash</label>
        <div class="input-box">
            <i class="fas fa-wallet"></i>
            <input type="number" id="cash" placeholder="Masukkan total uang cash">
        </div>
    </div>

    <div class="form-group">
        <label>Admin</label>
        <div class="input-box">
            <i class="fas fa-minus-circle"></i>
            <input type="number" id="admin" value="0">
        </div>
    </div>

    <div class="form-group">
        <label>Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user-minus"></i>
            <input type="number" id="penyetor" value="0">
        </div>
    </div>

    <div class="form-group">
        <label>Sisa TF</label>
        <div class="hasil" id="sisaTF">
            Rp 0
        </div>
    </div>

    <div class="form-group">
        <label>Nama Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user"></i>
            <input type="text" id="namaPenyetor">
        </div>
    </div>

    <div class="form-group">
        <label>Nama Konter</label>
        <div class="input-box">
            <i class="fas fa-store"></i>
            <input type="text" id="namaKonter">
        </div>
    </div>

    <button class="btn gps" onclick="ambilLokasi()">
        <i class="fas fa-location-dot"></i>
        Ambil Lokasi GPS
    </button>

    <div class="lokasi" id="lokasi">
        Lokasi belum diambil
    </div>

<div class="form-group">
    <label>Bukti Transfer (Wajib Foto Langsung)</label>

    <button type="button" class="btn camera" onclick="startCamera()">
        <i class="fas fa-camera"></i>
        Buka Kamera
    </button>

    <video id="video" autoplay playsinline></video>

    <button type="button" class="btn capture" onclick="capturePhoto()">
        <i class="fas fa-camera-retro"></i>
        Ambil Foto
    </button>

    <canvas id="canvas" style="display:none;"></canvas>

    <img id="preview" class="preview">
</div>

    <button class="btn wa" onclick="shareWA()">
        <i class="fab fa-whatsapp"></i>
        Share WhatsApp
    </button>

    <button class="btn reset" onclick="resetForm()">
        <i class="fas fa-rotate-left"></i>
        Reset
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
