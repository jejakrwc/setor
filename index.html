<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setoran Tunai POS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="icon-circle">
            <i class="fas fa-money-bill-wave"></i>
        </div>
        <h2>SETORAN TUNAI</h2>
        <p class="sub">POS Mobile System</p>
    </div>

    <!-- INPUT CASH -->
    <div class="form-group">
        <label>Total Uang Cash</label>
        <div class="input-box">
            <i class="fas fa-wallet"></i>
            <input type="number" id="cash" placeholder="Masukkan total cash">
        </div>
    </div>

    <!-- ADMIN -->
    <div class="form-group">
        <label>Admin</label>
        <div class="input-box">
            <i class="fas fa-minus-circle"></i>
            <input type="number" id="admin" value="0">
        </div>
    </div>

    <!-- PENYETOR -->
    <div class="form-group">
        <label>Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user-minus"></i>
            <input type="number" id="penyetor" value="0">
        </div>
    </div>

    <!-- HASIL -->
    <div class="form-group">
        <label>Sisa TF</label>
        <div class="hasil" id="sisaTF">Rp 0</div>
    </div>

    <!-- NAMA PENYETOR -->
    <div class="form-group">
        <label>Nama Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user"></i>
            <select id="namaPenyetor">
                <option value="">Pilih Penyetor</option>
                <option value="Rizki Wahyu Chandra">Rizki Wahyu Chandra</option>
                <option value="Leo Adrian">Leo Adrian</option>
            </select>
        </div>
    </div>

    <!-- NAMA KONTER -->
    <div class="form-group">
        <label>Nama Konter</label>
        <div class="input-box">
            <i class="fas fa-store"></i>
            <input type="text" id="namaKonter" placeholder="Nama konter">
        </div>
    </div>

    <!-- MEDIA CAMERA -->
    <div class="media-card">

        <div class="media-title">
            <i class="fas fa-camera"></i>
            Bukti Transfer
        </div>

        <video id="video" autoplay playsinline muted></video>

        <canvas id="canvas" style="display:none;"></canvas>

        <img id="preview" alt="Preview Foto" style="display:none;">
    </div>

    <!-- BUTTON ACTION -->
    <div class="button-group">

        <button class="camera" type="button" onclick="startCamera()">
            <i class="fas fa-camera"></i>
            Kamera
        </button>

        <button class="capture" type="button" onclick="capturePhoto()">
            <i class="fas fa-image"></i>
            Gambar
        </button>

        <button class="wa" type="button" onclick="shareWA()">
            <i class="fab fa-whatsapp"></i>
            Share
        </button>

        <button class="reset" type="button" onclick="resetForm()">
            <i class="fas fa-rotate-left"></i>
            Reset
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
