<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Tunai</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <i class="fas fa-money-bill-wave"></i>
        <h2>SETORAN TUNAI</h2>
    </div>

    <div class="form-group">
        <label>Total Uang Cash</label>
        <div class="input-box">
            <i class="fas fa-wallet"></i>
            <input type="number" id="cash" placeholder="Masukkan total uang cash">
        </div>
    </div>

    <div class="form-group">
        <label>Admin</label>
        <div class="input-box">
            <i class="fas fa-minus-circle"></i>
            <input type="number" id="admin" value="0">
        </div>
    </div>

    <div class="form-group">
        <label>Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user-minus"></i>
            <input type="number" id="penyetor" value="0">
        </div>
    </div>

    <div class="form-group">
        <label>Sisa TF</label>
        <div class="hasil" id="sisaTF">
            Rp 0
        </div>
    </div>

    <div class="form-group">
        <label>Nama Penyetor</label>
        <div class="input-box">
            <i class="fas fa-user"></i>
            <input type="text" id="namaPenyetor">
        </div>
    </div>

    <div class="form-group">
        <label>Nama Konter</label>
        <div class="input-box">
            <i class="fas fa-store"></i>
            <input type="text" id="namaKonter">
        </div>
    </div>

    
<div class="button-group">

<button type="button" class="btn camera" onclick="startCamera()">
    <i class="fas fa-camera"></i>
    Kamera
</button>

    <button type="button" class="btn capture"
        onclick="capturePhoto()">
        <i class="fas fa-image"></i>
        Gambar
    </button>

    <button type="button" class="btn wa"
        onclick="shareWA()">
        <i class="fab fa-whatsapp"></i>
        Share
    </button>

    <button type="button" class="btn reset"
        onclick="resetForm()">
        <i class="fas fa-rotate-left"></i>
        Reset
    </button>

</div>
</div>

</div>
<video
    id="video"
    autoplay
    playsinline
    muted
    style="display:none;width:100%;border-radius:14px;">
</video>

<canvas
    id="canvas"
    style="display:none;">
</canvas>

<video
    id="video"
    autoplay
    playsinline
    muted
    style="display:none;width:100%;margin-top:10px;border-radius:12px;">
</video>

<canvas
    id="canvas"
    style="display:none;">
</canvas>

<img
    id="preview"
    class="preview"
    style="display:none;width:100%;margin-top:10px;border-radius:12px;border:1px solid #ddd;">
<script src="script.js"></script>

</body>
</html>
